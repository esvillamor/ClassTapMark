    .carousel{
      position:relative;
      background: rgba(255,255,255,.92);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      color: var(--text);
      touch-action: pan-y; /* allow vertical scroll, handle horizontal swipe */
      user-select: none;
      -webkit-user-select: none;
    }

    .track{
      display:flex;
      transition: transform .22s ease;

    }
    .card{

    }
    .card p{ margin:0 0 12px; color:#334155; }
    .qr{
      width: 100%;
      max-width: 320px;
      border-radius: 14px;
      border: 1px solid var(--muted);
      background:#fff;
      display:block;
    }
    .row{
      display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start;justify-content: center;
    }
    .col{
      flex: 1 1 260px;
      min-width: 240px;
    }

    .btnrow{
      display:flex; gap:10px; justify-content:space-between;
      margin-top: 12px;
    }
    .btn{
      border:none; cursor:pointer;
      padding: 10px 12px;
      border-radius: 12px;
      font-weight:800;
      color:#fff;
      background: linear-gradient(135deg,var(--bg1),var(--bg2));
      box-shadow: 0 10px 22px rgba(0,0,0,.15);

    }
    .btn.secondary{
      background: #111827;
    }

    .dots{
      display:flex; gap:6px; justify-content:center; margin-top: 10px;
    }
    .dot{
      width: 8px; height: 8px; border-radius: 999px;
      background: rgba(255,255,255,.45);

    .dot.active{

    }

    a.link{

      color:#1d4ed8; font-weight:700;

      word-break: break-word;
    }
    .hint{

      font-size:.9rem;
      opacity:.95;
    }
    .hint b{ color:#fff; }
  </style>

  <script>
    (function(){
      const track = document.getElementById('track');
      const carousel = document.getElementById('carousel');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const dotsHost = document.getElementById('dots');
      const cards = Array.from(track.children);
      let idx = 0;

      // dots
      const dots = cards.map((_,i)=>{
        const d = document.createElement('div');
        d.className = 'dot' + (i===0 ? ' active':'');
        d.addEventListener('click', ()=>go(i));
        dotsHost.appendChild(d);
        return d;
      });
      function syncDots(){
        dots.forEach((d,i)=>d.classList.toggle('active', i===idx));
      }

      function go(i){
        idx = Math.max(0, Math.min(cards.length-1, i));
        track.style.transform = `translateX(${-idx*100}%)`;
        syncDots();
      }
      prevBtn.addEventListener('click', ()=>go(idx-1));
      nextBtn.addEventListener('click', ()=>go(idx+1));

      // Swipe
      let active=false, startX=0, startY=0, axis=null, triggered=false;
      const TH=40, SLOP=8, DOM=1.2;
      carousel.addEventListener('pointerdown', (e)=>{
        if (e.pointerType==='mouse' && e.button!==0) return;
        active=true; triggered=false; axis=null;
        startX=e.clientX; startY=e.clientY;
      }, {passive:true});

      carousel.addEventListener('pointermove', (e)=>{
        if (!active || triggered) return;
        const dx=e.clientX-startX, dy=e.clientY-startY;
        if (!axis){
          if (Math.abs(dx)<SLOP && Math.abs(dy)<SLOP) return;
          axis = (Math.abs(dx) > Math.abs(dy)*DOM) ? 'x' : 'y';
        }
        if (axis!=='x') return;
        e.preventDefault();
        if (Math.abs(dx)>=TH){
          triggered=true;
          if (dx>0) go(idx-1); else go(idx+1);
        }
      }, {passive:false});

      carousel.addEventListener('pointerup', ()=>{active=false;});
      carousel.addEventListener('pointercancel', ()=>{active=false;});
    })();
  </script>
