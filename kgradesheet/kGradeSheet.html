<div id="kGradeSheetModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" style="display:none">
  <div class="modal-content ctm-kgs-modal-content">
    <div class="ctm-kgs-topbar">
      <div>
        <h3>KS1 Descriptive Grade Sheet</h3>
        <div class="ctm-kgs-subtitle">
          <span id="kgsTopClass">No class loaded</span>
          <span>•</span>
          <span id="kgsTopGradeYear">No grade/year</span>
          <span>•</span>
          <span id="kgsTopCount">0 learners</span>
          <span>•</span>
          <span id="kgsTopMode" class="ctm-kgs-context-badge">KS1 Descriptive</span>
        </div>
      </div>
      <div class="ctm-kgs-topbar-actions">
        <button id="kgsBtnRefresh" class="primary" type="button">Refresh / Sync</button>
        <button id="kgsBtnExportCsv" class="primary" type="button">Export CSV</button>
        <button id="kgsBtnClose" class="danger" type="button" aria-label="Close">✕</button>
      </div>
    </div>

    <div id="kgsFlash" class="ctm-kgs-flash" aria-live="polite"></div>

    <div class="ctm-kgs-tabs" role="tablist" aria-label="KS1 Grade Sheet Tabs">
      <button type="button" class="ctm-kgs-tab active" data-kgs-tab="overview">Overview</button>
      <button type="button" class="ctm-kgs-tab" data-kgs-tab="learner">Learner View</button>
      <button type="button" class="ctm-kgs-tab" data-kgs-tab="records">Linked Class Records</button>
      <button type="button" class="ctm-kgs-tab" data-kgs-tab="settings">Settings</button>
    </div>

    <section id="kgsPanelOverview" class="ctm-kgs-panel active">
      <div class="ctm-kgs-panel-title">Descriptor Summary</div>
      <div class="ctm-kgs-summary-grid" id="kgsSummaryCards"></div>
      <div class="ctm-kgs-table-wrap">
        <table id="kgsTable" class="ctm-kgs-table"></table>
      </div>
    </section>

    <section id="kgsPanelLearner" class="ctm-kgs-panel">
      <div class="ctm-kgs-panel-title">Learner Descriptor View</div>
      <div class="ctm-kgs-learner-tools">
        <select id="kgsLearnerPicker" aria-label="Select learner"></select>
      </div>
      <div id="kgsLearnerCard"></div>
    </section>

    <section id="kgsPanelRecords" class="ctm-kgs-panel">
      <div class="ctm-kgs-panel-title">Linked Class Records</div>
      <div id="kgsLinkedRecords"></div>
    </section>

    <section id="kgsPanelSettings" class="ctm-kgs-panel">
      <div class="ctm-kgs-panel-title">Display Settings</div>
      <div class="ctm-kgs-settings-grid">
        <label><input type="checkbox" id="kgsShowDescriptions" checked> Show General Description</label>
        <label><input type="checkbox" id="kgsShowInstructionalResponse" checked> Show Instructional Response</label>
        <label><input type="checkbox" id="kgsShowTeacherNotes" checked> Show Teacher Notes</label>
        <label><input type="checkbox" id="kgsShowInterventionNotes" checked> Show Intervention Notes</label>
      </div>
      <div class="ctm-kgs-note">This module stores data under <code>kgradesheet:&lt;classId&gt;</code> and does not use the numeric Grade Sheet storage key.</div>
    </section>
  </div>
</div>
